
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar variables de Firebase
        run: |
          printf '%s\n' "$FIREBASE_ENV" > .env
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}

      - name: Instalar dependencias y compilar
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTLOCK_SHIELD_AA229 }}
          channelId: live
          projectId: smartlock-shield-aa229
